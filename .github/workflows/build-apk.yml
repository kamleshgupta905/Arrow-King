name: Build Arrow King Android APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
      - arena/01a0d38e-arrow-king
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Arrow-King.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowKing-v${{ steps.ver.outputs.version }}-APK
          path: Arrow-King.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Arrow King v${{ steps.ver.outputs.version }} Premiere APK
          make_latest: true
          body: |
            **Arrow King v${{ steps.ver.outputs.version }} — Premiere**

            - Royal opening court, gold header, and animated splash
            - Mode selector with house meters and continue seal
            - Chamber score: choir, harp, and gold bells
            - In-game flow combo and cleaner HUD
            - Phone auto-update from this GitHub release (Arrow-King.apk)

            Install the APK, allow unknown-app installs once, and the game will offer the next crown automatically.
          files: Arrow-King.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
