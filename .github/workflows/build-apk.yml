name: Build Arrow King Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowKing-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: Arrow King v1.4.0 APK (Cinematic Opening + Apple Settings + 3D Motion)
          body: |
            👑 **Arrow King v1.4.0 - Official Android APK**
            
            - 🌟 Animated Cinematic Opening Reveal with 3D Orbit Rings & Metallic Sweep
            - ⚙️ Apple-Grade Frosted Glass Settings Control Squircle with Rotating Spring Spin
            - 🕹️ 3D Motion Physics & Interactive Tilt on Hero Emblem & Cards (ThreeUI / MotionSites style)
            - 📱 Full Responsive Matrix for all phone aspect ratios, foldables & tablets
            - 🛡️ Zero White Screen & Zero Default Capacitor Logo
            - 💎 High-Earning AdMob Integration (Rewarded & Interstitial Cooldown)
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
