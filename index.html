<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Arrow King - 600 Vector Puzzle Levels & Hacker Mode</title>
  <meta name="description" content="Arrow King: The ultimate vector arrow puzzle game. Escape 600 handcrafted levels across 6 categories without collisions, including fast-paced timed Hacker mode.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Opening Animation & Title Layer -->
    <div id="intro-layer" class="ui-layer"></div>

    <!-- 50-Level Selection Screen Layer -->
    <div id="level-select-layer" class="ui-layer" style="display: none;"></div>

    <!-- In-Game HUD (Level name, moves, par, undo, hint, pause) -->
    <div id="hud-layer" class="ui-layer" style="display: none;"></div>

    <!-- Modals (Victory, Settings, Level 50 Grand Finale) -->
    <div id="modal-layer" class="ui-layer"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
