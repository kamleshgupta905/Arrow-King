<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Arrow King - Vector Arrow Puzzle Game</title>
  <meta name="description" content="Arrow King: The ultimate vector arrow puzzle game. Escape handcrafted shape levels across categories without collisions, including fast-paced timed Hacker mode.">

  <!-- App PNG Icons & Manifest (No SVG) -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Animated Cinematic Opening Splash Screen -->
    <div id="splash-layer" class="splash-screen-overlay">
      <div class="splash-ambient-mesh"></div>
      <div class="splash-glow-halo"></div>
      <div class="splash-orbit-ring ring-outer"></div>
      <div class="splash-orbit-ring ring-inner"></div>
      
      <div class="splash-icon-wrapper">
        <div class="splash-holo-sheen"></div>
        <img src="/icon-512.png" alt="Arrow King Icon" class="splash-animated-icon" />
        <div class="splash-crown-beam"></div>
        <div class="splash-metallic-sweep"></div>
      </div>

      <div class="splash-title-wrap">
        <div class="splash-eyebrow-badge">
          <span>👑 ROYAL VECTOR ESCAPE</span>
        </div>
        <h1 class="splash-game-title">ARROW <span class="accent-title">KING</span></h1>
        <p class="splash-subtitle-tagline">MASTER THE SEQUENCE • CLAIM THE CROWN</p>
        
        <div class="splash-loading-bar">
          <div class="splash-loading-progress">
            <div class="splash-laser-head"></div>
          </div>
        </div>

        <div class="splash-tap-hint">TAP SCREEN TO START</div>
      </div>
    </div>

    <!-- Opening Animation & Title Layer -->
    <div id="intro-layer" class="ui-layer"></div>

    <!-- Difficulty / Complexity Selection Screen Layer -->
    <div id="complexity-select-layer" class="ui-layer" style="display: none;"></div>

    <!-- Level Selection Screen Layer -->
    <div id="level-select-layer" class="ui-layer" style="display: none;"></div>

    <!-- In-Game HUD (Level name, moves, par, undo, hint, pause) -->
    <div id="hud-layer" class="ui-layer" style="display: none;"></div>

    <!-- Modals (Victory, Settings, Level 50 Grand Finale) -->
    <div id="modal-layer" class="ui-layer"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
